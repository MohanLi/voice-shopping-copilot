# USD per million tokens, used by the cost ledger (logs/llm_ledger.jsonl) and the budget guard.
# Anthropic prices checked against the pricing page on 2026-11-10. Models that are not listed are
# recorded with cost 0 and flagged "unpriced" in the ledger, so add a row when you switch models.
anthropic:
  claude-haiku-5-5:   {input: 0.10, output: 0.50, cache_read: 0.01, cache_write: 0.125}
  claude-sonnet-5-5:  {input: 2.00, output: 10.00, cache_read: 0.20, cache_write: 2.50}
  claude-opus-5-5:    {input: 4.00, output: 20.00, cache_read: 0.40, cache_write: 5.00}
  claude-fable-5-2:   {input: 8.00, output: 40.00, cache_read: 0.80, cache_write: 10.00}
  claude-haiku-4-5:   {input: 1.00, output: 5.00, cache_read: 0.10, cache_write: 1.25}
  claude-sonnet-4-6:  {input: 3.00, output: 15.00, cache_read: 0.30, cache_write: 3.75}
# Local models cost nothing per token.
ollama:
  "*": {input: 0.0, output: 0.0}
# Per-request server tools (USD per call).
tools:
  anthropic_web_search: 0.01
