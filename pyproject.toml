[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voice-shopping-copilot"
version = "0.1.0"
description = "Voice-to-voice, multi-agent shopping assistant: LangGraph agents, agentic RAG over a private product catalog, a two-tool MCP server (rag.search, web.search), grounded answers with citations, and a ProofAgent evaluation."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Mohan (Kevin) Li" }]
keywords = ["langgraph", "mcp", "agentic-rag", "voice-agent", "whisper", "tts", "e-commerce", "proofagent"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Runtime: no PyTorch. Embeddings/reranker/TTS run on onnxruntime, Whisper on CTranslate2.
dependencies = [
    # --- agent orchestration + model-agnostic LLM access ---
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.0,<4",
    "langchain>=1.4,<2",
    "langchain-core>=1.7,<2",
    "langchain-anthropic>=1.7,<2",
    "langchain-openai>=1.7,<2",
    "langchain-ollama>=1.1,<2",
    # --- MCP server + client ---
    # The 1.x SDK line (FastMCP). 2.x renames FastMCP to MCPServer and McpError to MCPError; see docs/decisions.md.
    "mcp>=1.30,<2",
    # --- retrieval ---
    "qdrant-client>=1.20",
    "fastembed>=0.9",
    "bm25s>=0.3",
    "PyStemmer>=2.2",
    "rapidfuzz>=3.14",
    # --- speech ---
    "faster-whisper>=1.2,<2",
    "av>=12",                 # audio decoding (WAV, MP3, WebM/Opus, MP4) for speech recognition
    "kokoro-onnx>=0.6",
    "soundfile>=0.13",
    "numpy>=2.0",
    # --- service ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sse-starlette>=2.2",
    "python-multipart>=0.0.20",
    # --- plumbing ---
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "tenacity>=9.0",
    "cachetools>=5.5",
    "typer>=0.15",
    "rich>=13.9",
    "pandas>=2.2",
    "pyarrow>=18.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Dataset + model downloads (run on a machine that reaches kaggle.com and huggingface.co).
download = ["kagglehub>=0.3", "huggingface-hub>=0.30"]
# Evaluation: ProofAgent harness + speech metrics.
eval = ["proofagent-harness>=0.13", "jiwer>=4.0"]
# Hosted voice alternatives (the local defaults need no key).
hosted-voice = ["openai>=1.60", "elevenlabs>=1.50"]
# Google Gemini as another swappable LLM provider.
gemini = ["langchain-google-genai>=2.0"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "jsonschema>=4.20",
    "ruff>=0.9",
    "mypy>=1.14",
    "types-PyYAML",
    "types-cachetools",
    "nbformat>=5.10",
    "nbclient>=0.10",
    "ipykernel>=6.29",
    "matplotlib>=3.9",
]

[project.scripts]
voiceshop = "voiceshop.cli:app"

[project.urls]
Repository = "https://github.com/MohanLi/voice-shopping-copilot"

[tool.hatch.build.targets.wheel]
packages = ["src/voiceshop"]

[tool.hatch.build.targets.wheel.force-include]
"prompts" = "voiceshop/_bundled/prompts"
"configs" = "voiceshop/_bundled/configs"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: needs a real LLM key and network (skipped unless --run-live)",
    "models: needs the local model files from scripts/download_assets.py",
    "slow: takes more than a few seconds",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::PendingDeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
# E501 long lines; B008 typer defaults; RUF001-3 typographic characters in product text;
# SIM905 keeps the word lists in data/attributes.py readable; SIM105/RUF005/RUF007/C416 are style-only.
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003", "SIM905", "SIM105", "RUF005", "RUF007", "C416"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
files = ["src/voiceshop"]
